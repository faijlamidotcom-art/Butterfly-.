<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 🦋</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: linear-gradient(#ffe6f0, #fff);
  font-family: 'Playfair Display', serif;
  text-align: center;
  overflow-x: hidden;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 30px 20px;
}

h2 {
  font-family: 'Dancing Script', cursive;
  font-size: 28px;
}

input, button {
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

button {
  background: #ff5c8a;
  color: white;
  margin-top: 25px;
}

.page {
  display: none;
}

img {
  width: 100%;
  border-radius: 18px;
  margin-bottom: 20px;
}

/* Countdown */
#countdown {
  font-size: 70px;
  font-weight: bold;
  display: none;
  height: 100vh;
  align-items: center;
  justify-content: center;
}

/* Falling text animation */
.line {
  opacity: 0;
  transform: translateY(-30px);
  animation: fall 1s ease forwards;
}

@keyframes fall {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Glow text */
.glow {
  font-size: 32px;
  font-weight: bold;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff4d6d; }
  to { text-shadow: 0 0 25px #6f42c1, 0 0 40px #0b7285; }
}
</style>
</head>

<body>

<!-- QUESTION -->
<div class="container" id="lock">
  <h2>“The person you love most is your?”  🦋</h2>
  <input id="answer" placeholder="Your answer">
  <br>
  <button onclick="check()">Enter</button>
</div>

<!-- COUNTDOWN -->
<div id="countdown"></div>

<!-- PAGE 1 -->
<div class="container page" id="page1">
  <img src="https://i.postimg.cc/k4s1XM9J/IMG-20251020-170701375-HDR-PORTRAIT.jpg">
  <div id="text1"></div>
  <button onclick="next(2)">tarpor</button>
</div>

<!-- PAGE 2 -->
<div class="container page" id="page2">
  <img src="https://i.postimg.cc/4yz2p4bd/IMG-20251020-201521082-HDR-(2)-(1).jpg">
  <div id="text2"></div>
  <button onclick="next(3)">tarpor</button>
</div>

<!-- PAGE 3 -->
<div class="container page" id="page3">
  <img src="https://i.postimg.cc/HLrCCHzK/Messenger-creation-A38F39E6-DB10-4319-A441-EE98274CB45C.jpg">
  <div id="text3"></div>
  <button onclick="next(4)">tarpor</button>
</div>

<!-- FINAL PAGE -->
<div class="container page" id="page4">
  <img src="https://i.postimg.cc/3NLgzdhJ/IMG-20251202-WA0029.jpg">
  <p class="">“আমি আরো লিখতাম 
তবে শব্দ ভান্ডার পরখ করে আকস্মিক শূন্যতা অনুভব করিলাম। 
এই স্বল্প শব্দের বেড়াজালে সহস্র অনুভূতি 
লিপিবদ্ধ করা বড়ই দুষ্কর । ইহার চাইতে না হয় অব্যক্তই থাক কিছু অভিব্যক্তি আর সুপ্ত অভিপ্রায় 🦋।”</p>
</div>

<script>
const parts = [
`The truth is…
I spent a long time trying to figure out what to write to you, because anything simple felt too small. Then I realized—I don’t want to talk about how you look. I want to talk about who you are, and what you’ve quietly become to me.`,

`There is a rare kind of magic in your honesty. You don’t wear a mask. You don’t pretend. You are just… you. Your loyalty isn’t something you announce—it’s something you live every day without even trying. Being around you gives me a feeling I didn’t know I was missing, like finding “home” in a person rather than a place.
And what truly melts me is your childish heart—the beautiful way you’ve never let the world harden you. I love how your eyes light up when you tell me about your day, how you share every small detail, every frustration, every tiny win.`,

`You have a soul that is both strong and soft, brave and gentle. You are kind in a way that feels effortless, genuine in a way that feels rare. Knowing you has changed me more than you probably realize.
And here is the part I’ve been holding back—not because I was unsure, but because I didn’t want to risk losing what we have.Somewhere along the way, my feelings for you grew beyond friendship I’m not asking you to rush, or to feel anything you don’t. I just wanted you to know the truth: I see you, I admire you deeply, and my heart would love the chance to be someone you love more than anything—is you heart feel the same? I really want to know.`
];

function check() {
  if (answer.value.trim().toLowerCase() === "nanu") {
    lock.style.display = "none";
    startCountdown();
  } else {
    alert("Wrong answer 🦋");
  }
}

function startCountdown() {
  const cd = document.getElementById("countdown");
  cd.style.display = "flex";
  let n = 5;
  cd.innerText = n;
  const i = setInterval(() => {
    n--;
    if (n === 0) {
      clearInterval(i);
      cd.style.display = "none";
      showPage(1);
      typeText("text1", parts[0]);
    } else {
      cd.innerText = n;
    }
  }, 1000);
}

function showPage(n) {
  document.querySelectorAll(".page").forEach(p => p.style.display="none");
  document.getElementById("page"+n).style.display="block";
}

function next(n) {
  showPage(n);
  if (n <= 3) typeText("text"+n, parts[n-1]);
}

function typeText(id, text) {
  const box = document.getElementById(id);
  box.innerHTML = "";
  text.split("\n").forEach((line, i) => {
    const p = document.createElement("p");
    p.className = "line";
    p.style.animationDelay = (i * 0.6) + "s";
    p.innerText = line;
    box.appendChild(p);
  });
}
</script>

</body>
</html>
